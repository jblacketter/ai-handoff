# Tagteam Configuration
# Defines the two AI agents and their roles in the collaboration workflow.

agents:
  lead:
    name: Claude
  reviewer:
    name: Codex

# Phase 33: escalation briefer (opt-in). Writes a decision brief when a
# cycle escalates; see `tagteam brief` / `tagteam rule`.
briefer:
  enabled: true

# Phase 38: gatekeeper pre-checks (opt-in). Runs the suite + the
# implementation-work check before each reviewer turn on impl cycles;
# fires from a running `tagteam watch` (any mode) or `tagteam gate run`.
# `tagteam gate check` is the lead's pre-flight.
gatekeeper:
  enabled: true
  on_submit: true      # Phase 41: the lead's `cycle add` runs the gate — the round's one full-suite run
  tests:
    command: ".venv/bin/python -m pytest -q -p no:cacheprovider"
    timeout_minutes: 15
