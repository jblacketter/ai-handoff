name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: "Also run the Windows job (slow: ~7-9 min)"
        type: boolean
        default: false

jobs:
  pytest:
    name: pytest (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[event]' pytest

      - name: Run tests
        run: python -m pytest -q

  # Windows is deliberately NOT part of the per-PR / per-push gate: it takes
  # ~7-9 min vs ~2 min for Ubuntu and Windows is not a current priority
  # (docs/roadmap.md, Backlog "CI: take the Windows job out of the per-PR
  # gate"). The Windows code paths (procs, headless, watcher pidfile,
  # port-lease fallback) are still supported — run this job on demand via
  # "Run workflow" with the `windows` input checked, and before releases
  # when Windows-relevant code changed. The headless suite drives a fake
  # agent CLI installed on PATH as claude/codex (a .cmd shim on Windows) —
  # this was the gating Windows criterion for Phase 31
  # (docs/phases/headless-turn-engine-30-arc.md).
  pytest-windows:
    name: pytest (windows-latest, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[event]' pytest

      - name: Run tests
        run: python -m pytest -q
