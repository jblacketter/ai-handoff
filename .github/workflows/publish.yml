name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches pyproject.toml and CITATION.cff versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} (=${TAG_VERSION}) does not match pyproject.toml version ${PYPROJECT_VERSION}"
            exit 1
          fi
          echo "Tag matches pyproject.toml: ${PYPROJECT_VERSION}"
          # CITATION.cff is bumped by scripts/release.py alongside pyproject.toml;
          # a hand bump that skips the script must not ship a stale citation.
          CFF_VERSION=$(sed -n 's/^version:[[:space:]]*//p' CITATION.cff | head -n1)
          if [ "$TAG_VERSION" != "$CFF_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} (=${TAG_VERSION}) does not match CITATION.cff version ${CFF_VERSION:-<missing>} — run scripts/release.py"
            exit 1
          fi
          echo "Tag matches CITATION.cff: ${CFF_VERSION}"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
